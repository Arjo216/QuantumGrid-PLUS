[package]
name = "core_ledger"
version = "0.1.0"
edition = "2021"

[dependencies]
# 1. PQC Standards (NIST FIPS 204)
pqcrypto-dilithium = "0.5"
pqcrypto-traits = "0.3"

# 2. Networking & gRPC (For AI Sentinel)
tonic = "0.12"
prost = "0.13"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }

# 3. HTTP & Serialization (For Quantum Oracle)
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 4. Utilities & Hashing
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

[build-dependencies]
tonic-build = "0.12"